<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joomla Advanced Generator | Pro Scaffolding</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons & Libs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <style>
        :root {
            --br-green: #009c3b;
            --br-yellow: #ffdf00;
            --br-blue: #002776;
            --br-white: #ffffff;
            --dark-bg: #05070a;
            --sidebar-bg: #0a0c10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-white: rgba(255, 255, 255, 0.15);
            --accent: #00e676;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-title: 'Outfit', sans-serif;
            --danger: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            font-family: var(--font-main);
            background-color: var(--dark-bg);
            color: var(--br-white);
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
            color-scheme: dark;
        }

        /* Layout */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-white);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .main-content {
            margin-left: 300px;
            flex: 1;
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            min-width: 0;
        }

        .preview-pane {
            width: 480px;
            background: #000;
            border-left: 1px solid var(--border-white);
            padding: 1.5rem;
            position: fixed;
            right: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 50;
        }

        .main-with-preview { margin-right: 480px; }

        /* Typography */
        h1, h2, h3 { font-family: var(--font-title); }
        .logo { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; margin-bottom: 0.5rem; }
        .logo span { color: var(--br-yellow); }
        .logo i { color: var(--br-green); }

        /* Lang Switcher */
        .lang-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-white);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: 0.3s;
        }
        .lang-btn.active { background: var(--br-blue); color: var(--br-yellow); border-color: var(--br-yellow); }

        /* Presets */
        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 0.5rem; }
        .preset-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-white);
            color: #fff;
            padding: 8px 6px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.6rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.3s;
        }
        .preset-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--br-green); }
        .preset-btn i { font-size: 1rem; color: var(--br-yellow); }

        /* Code Blocks */
        .preview-title { font-size: 0.75rem; color: var(--br-yellow); margin-bottom: 0.8rem; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; font-weight: 800; border-bottom: 1px solid var(--border-white); padding-bottom: 5px; }
        
        .code-preview {
            background: #0a0c10 !important;
            padding: 1rem !important;
            border-radius: 8px !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 0.7rem !important;
            border: 1px solid var(--border-white) !important;
            color: #ffffff !important;
            white-space: pre-wrap !important;
            overflow: auto;
            margin-bottom: 1.5rem !important;
            display: block;
        }
        .code-preview code { color: #ffffff !important; }

        .php-editor-area {
            width: 100%;
            height: 350px;
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            padding: 1rem;
            border: 1px solid var(--accent);
            border-radius: 8px;
            resize: vertical;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        /* Form */
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.2rem; }
        .input-group label { font-size: 0.7rem; font-weight: 700; color: var(--br-yellow); text-transform: uppercase; }
        .input-group input, .input-group select, .input-group textarea {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-white);
            padding: 0.7rem;
            border-radius: 10px;
            color: #fff;
        }

        .field-card {
            background: var(--card-bg);
            border: 1px solid var(--border-white);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }
        .field-card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .btn-zip { background: linear-gradient(135deg, var(--br-blue), #0039cb); color: var(--br-yellow); border: none; padding: 1rem; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 1rem; }

        @media (max-width: 1100px) {
            .preview-pane { display: none; }
            .main-with-preview { margin-right: 0; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLang('en')">EN</button>
            <button class="lang-btn" onclick="setLang('pt')">PT</button>
        </div>
        <a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> Joomla<span>Gen</span></a>
        
        <div class="settings-group">
            <h3 data-i18n="sidebar-meta" style="font-size: 0.7rem; opacity: 0.5; margin-bottom: 1rem;">META DATA</h3>
            <div class="input-group"><label data-i18n="lbl-mod-name">Module Name</label><input type="text" id="moduleName" value="My Custom Module"></div>
            <div class="input-group"><label data-i18n="lbl-namespace">Namespace</label><input type="text" id="namespace" value="MyCustomModule"></div>
            
            <h3 data-i18n="sidebar-presets" style="font-size: 0.7rem; opacity: 0.5; margin: 1rem 0;">PRESETS</h3>
            <div class="presets-grid">
                <button class="preset-btn" onclick="loadPreset('carousel')"><i class="fa-solid fa-images"></i><span>Carousel</span></button>
                <button class="preset-btn" onclick="loadPreset('hero')"><i class="fa-solid fa-rectangle-ad"></i><span>Hero</span></button>
                <button class="preset-btn" onclick="loadPreset('pricing')"><i class="fa-solid fa-tags"></i><span>Pricing</span></button>
                <button class="preset-btn" onclick="loadPreset('faq')"><i class="fa-solid fa-circle-question"></i><span>FAQ</span></button>
                <button class="preset-btn" onclick="loadPreset('testimonials')"><i class="fa-solid fa-comment-dots"></i><span>Reviews</span></button>
                <button class="preset-btn" onclick="loadPreset('features')"><i class="fa-solid fa-list-check"></i><span>Features</span></button>
                <button class="preset-btn" onclick="loadPreset('contact')"><i class="fa-solid fa-envelope"></i><span>Contact</span></button>
                <button class="preset-btn" onclick="loadPreset('social')"><i class="fa-solid fa-share-nodes"></i><span>Social</span></button>
                <button class="preset-btn" onclick="loadPreset('map')"><i class="fa-solid fa-location-dot"></i><span>Map</span></button>
                <button class="preset-btn" onclick="loadPreset('video')"><i class="fa-solid fa-video"></i><span>Video</span></button>
            </div>
        </div>

        <button class="btn-zip" onclick="generatePackage()"><i class="fa-solid fa-file-zipper"></i> <span data-i18n="btn-zip">DOWNLOAD ZIP</span></button>
    </aside>

    <main class="main-content main-with-preview">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <div><h1 data-i18n="builder-title">Fields Architect</h1><p data-i18n="builder-subtitle" style="opacity:0.5;">Configure parameters</p></div>
            <button onclick="addField()" style="background:var(--accent); color:#000; border:none; padding:0.8rem 1.5rem; border-radius:12px; font-weight:800; cursor:pointer;">+ ADD FIELD</button>
        </header>
        <div id="fieldList"></div>
    </main>

    <aside class="preview-pane">
        <h2 class="preview-title" data-i18n="preview-xml">Manifest XML</h2>
        <pre class="code-preview language-markup"><code id="xmlPreview"></code></pre>
        
        <h2 class="preview-title">default.php (Editable)</h2>
        <textarea id="phpEditor" class="php-editor-area" spellcheck="false" oninput="customPHP = this.value"></textarea>

        <h2 class="preview-title" data-i18n="preview-struct">Structure</h2>
        <pre class="code-preview language-bash"><code id="folderStructure"></code></pre>
    </aside>

    <script>
        const i18n = {
            en: { "sidebar-meta": "META DATA", "sidebar-presets": "PRESETS", "lbl-mod-name": "Module Name", "lbl-namespace": "Namespace", "btn-zip": "DOWNLOAD ZIP", "builder-title": "Fields Architect", "builder-subtitle": "Configure parameters", "preview-xml": "Manifest XML", "preview-struct": "Structure", "field-default-label": "New Field", "confirm-preset": "Replace fields?" },
            pt: { "sidebar-meta": "META DADOS", "sidebar-presets": "MODELOS", "lbl-mod-name": "Nome do Módulo", "lbl-namespace": "Namespace", "btn-zip": "BAIXAR ZIP", "builder-title": "Arquiteto de Campos", "builder-subtitle": "Configure os parâmetros", "preview-xml": "Manifest XML", "preview-struct": "Estrutura", "field-default-label": "Novo Campo", "confirm-preset": "Substituir campos?" }
        };

        const presets = {
            carousel: { name: 'My Carousel', fields: [{ id: 1, type: 'subform', name: 'slides', label: 'Slides', fields: [{ id: 11, type: 'media', name: 'image', label: 'Image' }] }] },
            hero: { name: 'My Hero Section', fields: [{ id: 1, type: 'media', name: 'bg_image', label: 'Background' }, { id: 2, type: 'text', name: 'title', label: 'Title' }] },
            pricing: { name: 'My Pricing Plans', fields: [{ id: 1, type: 'subform', name: 'plans', label: 'Plans', fields: [{ id: 11, type: 'text', name: 'name', label: 'Name' }] }] },
            faq: { name: 'My FAQ Accordion', fields: [{ id: 1, type: 'subform', name: 'items', label: 'FAQ', fields: [{ id: 11, type: 'text', name: 'question', label: 'Q' }] }] },
            testimonials: { name: 'My Testimonials', fields: [{ id: 1, type: 'subform', name: 'reviews', label: 'Reviews', fields: [{ id: 11, type: 'media', name: 'avatar', label: 'Photo' }] }] },
            features: { name: 'My Features Grid', fields: [{ id: 1, type: 'subform', name: 'features', label: 'Features', fields: [{ id: 11, type: 'text', name: 'icon', label: 'Icon' }]}] },
            map: { name: 'My Google Map', fields: [{ id: 1, type: 'text', name: 'api_key', label: 'API Key' }] },
            video: { name: 'My Video Hero', fields: [{ id: 1, type: 'url', name: 'url', label: 'Video' }] },
            contact: { name: 'My Contact Form', fields: [{ id: 1, type: 'email', name: 'recipient', label: 'Email' }] },
            social: { name: 'My Social Links', fields: [{ id: 1, type: 'subform', name: 'links', label: 'Links', fields: [{ id: 11, type: 'text', name: 'icon', label: 'Icon' }] }] }
        };

        let currentLang = 'en', currentPresetKey = null, customPHP = '', phpTouched = false;
        let fields = [{ id: Date.now(), type: 'text', name: 'title', label: 'Title', default: 'Hello', collapsed: false }];
        const fieldTypes = ['text', 'textarea', 'list', 'radio', 'checkbox', 'calendar', 'color', 'editor', 'media', 'subform', 'tel', 'url', 'email', 'integer', 'range', 'sql', 'user'];

        function setLang(lang) {
            currentLang = lang; document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = i18n[currentLang][el.getAttribute('data-i18n')]; });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick*="${lang}"]`).classList.add('active'); render();
        }

        function loadPreset(key) {
            if (fields.length > 0 && !confirm(i18n[currentLang]['confirm-preset'])) return;
            currentPresetKey = key; phpTouched = false; const p = presets[key];
            document.getElementById('moduleName').value = p.name;
            fields = JSON.parse(JSON.stringify(p.fields));
            const val = document.getElementById('moduleName').value;
            document.getElementById('namespace').value = val.normalize("NFD").replace(/[^A-Za-z0-9]/g, '').charAt(0).toUpperCase() + val.normalize("NFD").replace(/[^A-Za-z0-9]/g, '').slice(1);
            render(); confetti({ particleCount: 100 });
        }

        function addField() { fields.push({ id: Date.now(), type: 'text', name: 'new_field', label: i18n[currentLang]['field-default-label'], collapsed: false }); render(); }
        function removeField(id) { fields = fields.filter(f => f.id !== id); render(); }
        function updateField(id, key, value) { const f = fields.find(f => f.id === id); if (f) { f[key] = value; if (key === 'label') f.name = value.toLowerCase().replace(/[^a-z0-9]/g, '_'); render(); } }

        function render() {
            const list = document.getElementById('fieldList'); list.innerHTML = '';
            fields.forEach(f => {
                const card = document.createElement('div'); card.className = 'field-card';
                card.innerHTML = `<div class="field-card-header"><strong>${f.label}</strong><button onclick="removeField(${f.id})">X</button></div>
                <div class="field-card-body" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                    <input type="text" value="${f.label}" oninput="updateField(${f.id}, 'label', this.value)">
                    <select onchange="updateField(${f.id}, 'type', this.value)">${fieldTypes.map(t => `<option value="${t}" ${f.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
                </div>`;
                list.appendChild(card);
            });
            updatePreview();
        }

        function updatePreview() {
            const modName = document.getElementById('moduleName').value || 'custom';
            const slug = modName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            
            let xml = `<config>\n  <fields name="params">\n    <fieldset name="basic">\n`;
            fields.forEach(f => { xml += `      <field name="${f.name}" type="${f.type}" label="MOD_${slug.toUpperCase()}_${f.name.toUpperCase()}_LABEL" />\n`; });
            xml += `    </fieldset>\n  </fields>\n</config>`;
            document.getElementById('xmlPreview').textContent = xml;

            const struct = `mod_${slug}/\n├── services/provider.php\n├── src/Dispatcher/Dispatcher.php\n├── tmpl/default.php\n└── mod_${slug}.xml`;
            document.getElementById('folderStructure').textContent = struct;

            if (!phpTouched) {
                let p = `<?php\ndefined('_JEXEC') or die;\nuse Joomla\\CMS\\Language\\Text;\n?>\n<div class="${slug}">\n`;
                if (currentPresetKey === 'carousel') p += `  <!-- Carousel slides -->\n  <?php foreach ($params->get('slides', []) as $slide) : ?>\n    <img src="<?php echo $slide->image; ?>">\n  <?php endforeach; ?>\n`;
                else p += `  <h1><?php echo $params->get('title', 'Hello'); ?></h1>\n`;
                p += `</div>`;
                customPHP = p;
                document.getElementById('phpEditor').value = p;
            }
            if (window.Prism) { Prism.highlightAll(); }
        }

        async function generatePackage() {
            const modName = document.getElementById('moduleName').value || 'My Module', slug = modName.toLowerCase().replace(/[^a-z0-9]/g, '_'), ns = document.getElementById('namespace').value || 'MyNamespace', prefix = `mod_${slug}`, zip = new JSZip(), root = zip.folder(prefix);
            root.file(`${prefix}.xml`, `<extension type="module" client="site" method="upgrade"><name>${prefix}</name><namespace path="src">Joomla\\Module\\${ns}\\Site</namespace></extension>`);
            root.folder('tmpl').file('default.php', customPHP);
            const blob = await zip.generateAsync({type: "blob"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${prefix}.zip`; a.click();
        }

        document.getElementById('moduleName').addEventListener('input', updatePreview);
        setLang('en');
    </script>
</body>
</html>
