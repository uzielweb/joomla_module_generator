<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joomla Advanced Generator | Pro Scaffolding</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

    <style>
        :root {
            --br-green: #009c3b; --br-yellow: #ffdf00; --br-blue: #002776; --br-white: #ffffff;
            --dark-bg: #05070a; --sidebar-bg: #0a0c10; --card-bg: rgba(255, 255, 255, 0.03);
            --border-white: rgba(255, 255, 255, 0.08); --accent: #00e676;
            --font-main: 'Plus Jakarta Sans', sans-serif; --danger: #ff5252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-main); background-color: var(--dark-bg); color: var(--br-white); height: 100vh; overflow: hidden; display: grid; grid-template-columns: 320px 1fr 480px; color-scheme: dark; }

        .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border-white); padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.2rem; }
        .main-content { padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .preview-pane { background: #000; border-left: 1px solid var(--border-white); padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }

        .logo { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; margin-bottom: 0.5rem; }
        .logo span { color: var(--br-yellow); }
        .logo i { color: var(--br-green); }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.8rem; }
        .input-group label { font-size: 0.65rem; font-weight: 800; color: var(--br-yellow); text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .input-group input, .input-group select, .input-group textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--border-white); padding: 0.7rem 0.9rem; border-radius: 10px; color: #fff; font-size: 0.85rem; }

        .presets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .preset-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--border-white); color: #fff; padding: 10px 8px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .preset-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--br-green); transform: translateY(-2px); }
        .preset-btn i { font-size: 1.1rem; color: var(--br-yellow); }

        .field-card { background: var(--card-bg); border: 1px solid var(--border-white); border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; }
        .field-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-white); padding-bottom: 0.8rem; margin-bottom: 1rem; }
        .field-card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-add { background: linear-gradient(135deg, var(--br-green), #00c853); color: #fff; border: none; padding: 0.8rem 1.5rem; border-radius: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .btn-zip { background: linear-gradient(135deg, var(--br-blue), #0039cb); color: var(--br-yellow); border: none; padding: 1.2rem; border-radius: 14px; font-weight: 800; cursor: pointer; width: 100%; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .preview-title { font-size: 0.7rem; color: var(--br-yellow); margin-bottom: 0.5rem; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid var(--border-white); padding-bottom: 5px; }
        .preview-box { background: #0a0c10; padding: 1rem; border-radius: 12px; border: 1px solid var(--border-white); margin-bottom: 1rem; max-height: 400px; overflow: auto; }
        .php-editor-area { width: 100%; height: 380px; background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; font-size: 0.8rem; padding: 1rem; border: 1px solid var(--accent); border-radius: 12px; resize: none; line-height: 1.5; }
        .subform-container { grid-column: span 2; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed var(--border-white); margin-top: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <a href="index.html" class="logo"><i class="fa-solid fa-cube"></i> Joomla<span>Gen</span></a>
        <div class="settings">
            <h3 style="font-size: 0.6rem; color: rgba(255,255,255,0.4); margin-bottom: 0.8rem;">META DATA</h3>
            <div class="input-group"><label>Module Name</label><input type="text" id="modName" value="My Features" oninput="update()"></div>
            <div class="input-group"><label>Namespace</label><input type="text" id="ns" value="MyFeatures"></div>
            <div class="input-group"><label>Author</label><input type="text" id="author" value="John Doe"></div>
            <div class="input-group"><label>Author URL</label><input type="text" id="authorUrl" value="https://example.com"></div>
            <div class="input-group"><label>Client</label><select id="client"><option value="site">Site</option><option value="administrator">Admin</option></select></div>
            <h3 style="font-size: 0.6rem; color: rgba(255,255,255,0.4); margin: 1rem 0 0.6rem 0;">PRESETS</h3>
            <div class="presets-grid">
                <button class="preset-btn" onclick="preset('carousel')"><i class="fa-solid fa-images"></i><span>Carousel</span></button>
                <button class="preset-btn" onclick="preset('hero')"><i class="fa-solid fa-rectangle-ad"></i><span>Hero</span></button>
                <button class="preset-btn" onclick="preset('pricing')"><i class="fa-solid fa-tags"></i><span>Pricing</span></button>
                <button class="preset-btn" onclick="preset('faq')"><i class="fa-solid fa-circle-question"></i><span>FAQ</span></button>
                <button class="preset-btn" onclick="preset('features')"><i class="fa-solid fa-list-check"></i><span>Features</span></button>
                <button class="preset-btn" onclick="preset('social')"><i class="fa-solid fa-share-nodes"></i><span>Social</span></button>
                <button class="preset-btn" onclick="preset('map')"><i class="fa-solid fa-location-dot"></i><span>Map</span></button>
                <button class="preset-btn" onclick="preset('video')"><i class="fa-solid fa-video"></i><span>Video</span></button>
                <button class="preset-btn" onclick="preset('contact')"><i class="fa-solid fa-envelope"></i><span>Contact</span></button>
            </div>
        </div>
        <button class="btn-zip" onclick="zip()"><i class="fa-solid fa-file-zipper"></i> DOWNLOAD ZIP</button>
    </aside>

    <main class="main-content">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <h1>Fields Architect</h1>
            <button class="btn-add" onclick="add()"><i class="fa-solid fa-plus"></i> ADD FIELD</button>
        </header>
        <div id="fields"></div>
    </main>

    <aside class="preview-pane">
        <h2 class="preview-title">Manifest XML</h2>
        <div class="preview-box"><pre class="language-markup"><code id="xml"></code></pre></div>
        <h2 class="preview-title">default.php</h2>
        <textarea id="php" class="php-editor-area" oninput="customPHP=this.value"></textarea>
        <h2 class="preview-title">Structure</h2>
        <div class="preview-box"><pre class="language-bash"><code id="struct"></code></pre></div>
    </aside>

    <script>
        const presets = {
            carousel: { n: 'Carousel', f: [{ id: 1, t: 'subform', n: 'slides', l: 'Slides', f: [{ id: 11, t: 'media', n: 'img', l: 'Image' }, { id: 12, t: 'text', n: 'txt', l: 'Title' }] }] },
            hero: { n: 'Hero', f: [{ id: 1, t: 'media', n: 'bg', l: 'Background' }, { id: 2, t: 'text', n: 'h1', l: 'Title' }] },
            pricing: { n: 'Pricing', f: [{ id: 1, t: 'subform', n: 'plans', l: 'Plans', f: [{ id: 11, t: 'text', n: 'p', l: 'Price' }] }] },
            faq: { n: 'FAQ', f: [{ id: 1, t: 'subform', n: 'items', l: 'FAQ', f: [{ id: 11, t: 'text', n: 'q', l: 'Q' }, { id: 12, t: 'textarea', n: 'a', l: 'A' }] }] },
            features: { n: 'Features', f: [{ id: 1, t: 'subform', n: 'feats', l: 'Features', f: [{ id: 11, t: 'text', n: 'i', l: 'Icon' }, { id: 12, t: 'text', n: 't', l: 'Title' }] }] },
            social: { n: 'Social', f: [{ id: 1, t: 'subform', n: 'links', l: 'Links', f: [{ id: 11, t: 'text', n: 'i', l: 'Icon' }, { id: 12, t: 'url', n: 'u', l: 'URL' }] }] },
            map: { n: 'Map', f: [{ id: 1, t: 'text', n: 'k', l: 'API Key' }, { id: 2, t: 'text', n: 'lt', l: 'Lat' }] },
            video: { n: 'Video', f: [{ id: 1, t: 'url', n: 'u', l: 'URL' }, { id: 2, t: 'media', n: 'p', l: 'Poster' }] },
            contact: { n: 'Contact', f: [{ id: 1, t: 'email', n: 'to', l: 'To' }] }
        };

        let list = [], customPHP = '', cur = 'features';
        const types = ['text', 'textarea', 'list', 'radio', 'checkbox', 'calendar', 'color', 'editor', 'media', 'subform', 'tel', 'url', 'email', 'integer', 'range', 'sql', 'user'];

        function preset(k) {
            cur = k; const p = presets[k]; document.getElementById('modName').value = 'My ' + p.n;
            document.getElementById('ns').value = 'My' + p.n; list = JSON.parse(JSON.stringify(p.f)); render();
        }

        function add(p = list) { p.push({ id: Date.now(), t: 'text', n: 'f_' + Date.now().toString().slice(-3), l: 'New Field', f: [] }); render(); }
        function rem(id, p = list) { const i = p.findIndex(x => x.id === id); if (i > -1) p.splice(i, 1); else p.forEach(x => { if (x.f) rem(id, x.f); }); render(); }
        function upd(id, k, v, p = list) { const x = find(id, p); if (x) { x[k] = v; if (k === 'l') x.n = v.toLowerCase().replace(/[^a-z0-9]/g, '_'); render(); } }
        function find(id, l) { for (let x of l) { if (x.id === id) return x; if (x.f) { let r = find(id, x.f); if (r) return r; } } return null; }

        function render() {
            const container = document.getElementById('fields'); container.innerHTML = '';
            list.forEach(x => container.appendChild(card(x))); update();
        }

        function card(x) {
            const d = document.createElement('div'); d.className = 'field-card';
            d.innerHTML = `<div class="field-card-header"><strong>${x.l}</strong><button style="background:var(--danger);color:#fff;border:none;cursor:pointer;padding:2px 6px;" onclick="rem(${x.id})">X</button></div>
            <div class="field-card-body">
                <div class="input-group"><label>Type</label><select onchange="upd(${x.id},'t',this.value)">${types.map(t=>`<option value="${t}" ${x.t===t?'selected':''}>${t}</option>`).join('')}</select></div>
                <div class="input-group"><label>Label</label><input type="text" value="${x.l}" oninput="upd(${x.id},'l',this.value)"></div>
                ${x.t==='subform'?`<div class="subform-container"><div id="s-${x.id}"></div><button class="btn-add" style="font-size:0.7rem;padding:4px;" onclick="addIn(${x.id})">+ Sub</button></div>`:''}
            </div>`;
            if (x.t==='subform') { const s = d.querySelector(`#s-${x.id}`); (x.f||[]).forEach(sf=>s.appendChild(card(sf))); }
            return d;
        }
        function addIn(pid) { const p = find(pid, list); if (p) { if (!p.f) p.f = []; add(p.f); } }

        function genPHP(s) {
            let p = '\x3C?php\ndefined(\'_JEXEC\') or die;\n?\x3E\n\x3Cdiv class="mod-' + s + '"\x3E\n';
            if (cur === 'features') p += '  \x3Cdiv class="row"\x3E\n    \x3C?php foreach ($params-\x3Eget(\'feats\', []) as $f) : ?\x3E\n      \x3Cdiv class="col-md-4"\x3E\x3Ci class="\x3C?php echo $f-\x3Ei; ?\x3E"\x3E\x3C/i\x3E\x3Ch3\x3E\x3C?php echo $f-\x3Et; ?\x3E\x3C/h3\x3E\x3C/div\x3E\n    \x3C?php endforeach; ?\x3E\n  \x3C/div\x3E\n';
            else if (cur === 'faq') p += '  \x3Cdiv class="accordion"\x3E\n    \x3C?php foreach ($params-\x3Eget(\'items\', []) as $i =\x3E $x) : ?\x3E\n      \x3Cbutton data-bs-target="#a-\x3C?php echo $i; ?\x3E"\x3E\x3C?php echo $x-\x3Eq; ?\x3E\x3C/button\x3E\n      \x3Cdiv id="a-\x3C?php echo $i; ?\x3E"\x3E\x3C?php echo $x-\x3Ea; ?\x3E\x3C/div\x3E\n    \x3C?php endforeach; ?\x3E\n  \x3C/div\x3E\n';
            else if (cur === 'contact') p += '  \x3Cform method="post"\x3E\x3Cbutton type="submit"\x3ESend to \x3C?php echo $params-\x3Eget(\'to\'); ?\x3E\x3C/button\x3E\x3C/form\x3E\n';
            else if (cur === 'video') p += '  \x3Cvideo controls poster="\x3C?php echo $params-\x3Eget(\'p\'); ?\x3E"\x3E\x3Csource src="\x3C?php echo $params-\x3Eget(\'u\'); ?\x3E" type="video/mp4"\x3E\x3C/video\x3E\n';
            else p += '  \x3Ch1\x3E\x3C?php echo $params-\x3Eget(\'h1\', \'Hello\'); ?\x3E\x3C/h1\x3E\n';
            return p + '\x3C/div\x3E';
        }

        function update() {
            const n = document.getElementById('modName').value || 'custom';
            const s = n.toLowerCase().replace(/[^a-z0-9]/g, '_');
            let xml = '\x3Cconfig\x3E\n  \x3Cfields name="params"\x3E\n    \x3Cfieldset name="basic"\x3E\n';
            function b(l, i) {
                let r = ''; l.forEach(x => {
                    if (x.t === 'subform') r += i + '\x3Cfield name="' + x.n + '" type="subform" multiple="true" layout="joomla.form.field.subform.repeatable-grid"\x3E\n' + i + '  \x3Cform\x3E\n' + b(x.f || [], i + '    ') + i + '  \x3C/form\x3E\n' + i + '\x3C/field\x3E\n';
                    else r += i + '\x3Cfield name="' + x.n + '" type="' + x.t + '" label="' + x.l + '" /\x3E\n';
                }); return r;
            }
            xml += b(list, '      ') + '    \x3C/fieldset\x3E\n  \x3C/fields\x3E\n\x3C/config\x3E';
            document.getElementById('xml').textContent = xml;
            document.getElementById('struct').textContent = 'mod_' + s + '/\n├── tmpl/default.php\n└── mod_' + s + '.xml';
            customPHP = genPHP(s); document.getElementById('php').value = customPHP;
            if (window.Prism) Prism.highlightAll();
        }

        async function zip() {
            const z = new JSZip(), n = document.getElementById('modName').value, s = n.toLowerCase().replace(/[^a-z0-9]/g, '_'), p = 'mod_' + s;
            const r = z.folder(p);
            r.file(p + '.xml', '\x3C?xml version="1.0" encoding="utf-8"?\x3E\x3Cextension type="module" client="' + document.getElementById('client').value + '"\x3E\x3Cname\x3E' + p + '\x3C/name\x3E\x3Cfiles\x3E\x3Cfolder module="' + p + '"\x3Etmpl\x3C/folder\x3E\x3C/files\x3E' + document.getElementById('xml').textContent + '\x3C/extension\x3E');
            r.folder('tmpl').file('default.php', customPHP);
            const bl = await z.generateAsync({type:"blob"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = p + '.zip'; a.click();
            confetti({ particleCount: 200 });
        }

        window.onload = () => preset('features');
    </script>
</body>
</html>
